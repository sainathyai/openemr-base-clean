# Layer D: weekly budgeted drift probe for the Clinical Co-Pilot.
# Runs UC-1 through the real model (Haiku) on a small patient sample and logs the
# verification/hallucination rates to Langfuse as a versioned experiment run, so
# model/prompt drift shows up release-over-release. Off the hot path, budget-capped.
#
# Requires repo secrets: ANTHROPIC_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY.
# Inert (skipped) until those are set and on the personal fork only.
name: copilot-drift-eval

on:
  schedule:
    - cron: "0 8 * * 1"        # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      patients:
        description: "How many patients to sample (budget cap)"
        default: "3"
        required: false

# Never fan out onto the upstream base repo.
jobs:
  drift:
    if: github.repository == 'sainathyai/openemr-base-clean'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot
    env:
      COPILOT_FIXTURES: app/data/fixtures
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: https://us.cloud.langfuse.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Drift probe (Haiku, budgeted)
        run: python -m eval.drift_eval --patients "${{ github.event.inputs.patients || '3' }}"
