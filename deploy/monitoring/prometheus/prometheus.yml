# Prometheus scrape config for the Clinical Co-Pilot agent tier.
# Runs as a side-car on the agent box, scraping the FastAPI /metrics exposition.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: copilot-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["copilot:8000"]      # docker-compose service name on the agent network
        labels:
          service: clinical-copilot
          tier: agent

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
